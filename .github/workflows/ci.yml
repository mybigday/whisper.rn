name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: npm run lint

      - name: Typecheck files
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: npm test -- --maxWorkers=2 --coverage

  build-ios-from-source:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # The other pods are most of this build and only change with the
      # example's dependencies, so this cache is not tied to the whisper.cpp
      # version.
      - name: Setup ccache
        uses: ./.github/actions/setup-ccache
        continue-on-error: true
        with:
          key: ios-from-source

      - name: Cache build & pods
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            example/ios/Pods
            example/ios/build
          key: ${{ runner.os }}-pods-${{ hashFiles('example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Upgrade CocoaPods to version 1.15.2
        run: |
          gem uninstall cocoapods --ignore-dependencies
          gem install cocoapods -v 1.15.2

      - name: Install cocoapods
        run: |
          npm run example run pods

      - name: Build example for iOS
        run: |
          npm run build:ios

      - name: Save ccache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-ccache

  # Every xcframework slice compiles the whole library, so the slices are split
  # over two parallel jobs: this one and build-ios-framework-slices. This job
  # builds the slice the example app runs on and proves the prebuilt path with
  # it. (The release workflow packages all four slices together.)
  build-ios-frameworks:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup ccache
        uses: ./.github/actions/setup-ccache
        continue-on-error: true
        with:
          key: ios-frameworks-simulator

      - name: Cache build & pods
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            example/ios/Pods
            example/ios/build
          key: ${{ runner.os }}-pods-${{ hashFiles('example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Upgrade CocoaPods to version 1.15.2
        run: |
          gem uninstall cocoapods --ignore-dependencies
          gem install cocoapods -v 1.15.2

      - name: Build frameworks
        run: |
          ./scripts/build-ios.sh ios-simulator

      # The podspec needs the xcframework to exist when not building from source.
      - name: Install cocoapods
        run: |
          npm run example run pods
        env:
          RNWHISPER_BUILD_FROM_SOURCE: 0

      - name: Build example for iOS
        run: |
          npm run build:ios

      - name: Save ccache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-ccache

  # The slices the example build above does not need. Only CMake and Xcode are
  # involved, so this job skips the Node.js setup.
  build-ios-framework-slices:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ccache
        uses: ./.github/actions/setup-ccache
        continue-on-error: true
        with:
          key: ios-frameworks-other-${{ hashFiles('vendor/VERSIONS') }}

      - name: Build frameworks
        run: |
          ./scripts/build-ios.sh ios-device tvos-simulator tvos-device

      - name: Save ccache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-ccache

  # The example's gradle.properties sets rnwhisperBuildFromSource=true, so this
  # compiles the whisper.cpp core inside the Gradle build (CPU-only: no Hexagon
  # SDK on the runner).
  build-android-from-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # Pin the JDK: with the runner's newer default (ubuntu-26.04), a JVM
      # restricted-method warning fails the Android Gradle Plugin's CMake
      # configure.
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup ccache
        uses: ./.github/actions/setup-ccache
        continue-on-error: true
        with:
          key: android-src-${{ hashFiles('vendor/VERSIONS') }}
          # Debug objects carry DWARF, so they need more room than the libs job's.
          max-size: 1G

      - name: Build example for Android
        env:
          # Build only the variants that exercise distinct code paths (generic
          # CPU, arm64 fp16, x86_64). The remaining ones differ only in the
          # CPU flags of the ggml-cpu and vad-cpu backends; build-android-libs
          # still builds all of them.
          ORG_GRADLE_PROJECT_rnwhisperVariants: rnwhisper,rnwhisper_v8fp16_va_2,rnwhisper_x86_64
        run: |
          npm run build:android

      - name: Save ccache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-ccache

  # Same path as the release workflow: prebuilt core libraries (including the
  # Hexagon variant and its DSP-side libraries), then the example app built
  # against them with only the JNI/JSI wrapper compiled by Gradle.
  build-android-libs:
    runs-on: ubuntu-latest
    steps:
      # Runners currently have ~85 GB free, several times what this job needs.
      # Only spend time on cleaning up if that stops being true.
      - name: Free disk space if short
        run: |
          df -h /
          available_gb=$(df --output=avail -BG / | tail -n 1 | tr -dc '0-9')
          if [ "$available_gb" -lt 40 ]; then
            sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
            df -h /
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # Pin the JDK: with the runner's newer default (ubuntu-26.04), a JVM
      # restricted-method warning fails the Android Gradle Plugin's CMake
      # configure.
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup ccache
        uses: ./.github/actions/setup-ccache
        continue-on-error: true
        with:
          key: android-libs-${{ hashFiles('vendor/VERSIONS') }}

      - name: Cache Hexagon HTP artifacts
        id: htp-cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            bin
            vendor/whisper.cpp/ggml/src/ggml-hexagon/htp/v73
          key: ${{ runner.os }}-htp-${{ hashFiles('scripts/build-hexagon-htp.sh', 'scripts/docker-build-wrapper.sh', 'vendor/whisper.cpp/ggml/src/ggml-hexagon/htp/**') }}

      # Building the DSP-side libraries runs the Hexagon SDK's tools, so that
      # needs the whole SDK (700 MB download, 3 GB unpacked).
      - name: Build Hexagon HTP libraries
        if: steps.htp-cache.outputs.cache-hit != 'true'
        run: |
          ./scripts/setup-hexagon-sdk.sh
          npm run build:hexagon-htp

      # With those libraries cached, the Hexagon variant only compiles against
      # the SDK's headers, which are small enough to keep between runs. They
      # are saved right after the download so that the cache can never pick up
      # the whole SDK.
      - name: Restore Hexagon SDK headers
        id: hexagon-sdk-cache
        if: steps.htp-cache.outputs.cache-hit == 'true'
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ~/.hexagon-sdk
          key: ${{ runner.os }}-hexagon-sdk-headers-${{ hashFiles('scripts/setup-hexagon-sdk.sh') }}

      - name: Setup Hexagon SDK headers
        if: steps.htp-cache.outputs.cache-hit == 'true' && steps.hexagon-sdk-cache.outputs.cache-hit != 'true'
        run: ./scripts/setup-hexagon-sdk.sh --headers-only

      - name: Save Hexagon SDK headers
        if: steps.htp-cache.outputs.cache-hit == 'true' && steps.hexagon-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/.hexagon-sdk
          key: ${{ runner.os }}-hexagon-sdk-headers-${{ hashFiles('scripts/setup-hexagon-sdk.sh') }}

      - name: Build libraries
        env:
          RNWHISPER_REQUIRE_HEXAGON: '1'
        run: |
          npm run build:android-libs

      # Proves the prebuilt path works with the libraries just built. The
      # example's gradle.properties forces from-source, and only the command
      # line outranks it.
      - name: Build example for Android
        run: |
          cd example/android
          ./gradlew assembleDebug --stacktrace -PrnwhisperBuildFromSource=false

      - name: Save ccache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-ccache
