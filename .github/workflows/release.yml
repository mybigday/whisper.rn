name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to upload assets to during a manual run. Leave blank to use the most recently published release tag.
        required: false
        type: string
      publish_to_npm:
        description: Publish the current package version to npm during a manual run.
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # The prebuilt rnwhisper core libraries (android/src/main/jniLibs) are a
  # release asset that the package's postinstall downloads; the Hexagon variant
  # and its DSP-side libraries (bin/, shipped inside the npm package) need the
  # Hexagon SDK and Docker, which is why they are built here rather than in
  # every consumer's Gradle build.
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup ccache
        uses: ./.github/actions/setup-ccache

      - name: Setup Hexagon SDK
        run: ./scripts/setup-hexagon-sdk.sh

      - name: Build Hexagon HTP libraries
        run: yarn build:hexagon-htp

      - name: Build Android libraries
        env:
          RNWHISPER_REQUIRE_HEXAGON: '1'
        run: yarn build:android-libs

      - name: Verify Android libraries
        run: |
          set -euo pipefail
          for lib in \
            arm64-v8a/librnwhisper.so \
            arm64-v8a/librnwhisper_v8.so \
            arm64-v8a/librnwhisper_v8fp16_va_2.so \
            arm64-v8a/librnwhisper_v8fp16_va_2_hexagon.so \
            armeabi-v7a/librnwhisper.so \
            armeabi-v7a/librnwhisper_vfpv4.so \
            x86_64/librnwhisper.so \
            x86_64/librnwhisper_x86_64.so \
            x86/librnwhisper.so \
            ; do
            if [ ! -f "android/src/main/jniLibs/$lib" ]; then
              echo "Missing prebuilt library: $lib" >&2
              exit 1
            fi
          done
          for lib in v73 v75 v79 v81; do
            if [ ! -f "bin/arm64-v8a/libggml-htp-$lib.so" ]; then
              echo "Missing Hexagon HTP library: libggml-htp-$lib.so" >&2
              exit 1
            fi
          done
          ls -lh android/src/main/jniLibs/*/ bin/arm64-v8a/

      - name: Package Android JNI libraries
        run: tar -czf whisper-rn-android-jni-libs.tar.gz android/src/main/jniLibs

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build-artifacts
          path: |
            bin/
            whisper-rn-android-jni-libs.tar.gz
          retention-days: 1

  publish:
    needs: build-android
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Resolve release metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          NPM_TAG=$(node -e '
            const version = require("./package.json").version
            const separator = version.indexOf("-")
            const prerelease = separator === -1
              ? ""
              : version.slice(separator + 1).split(/[.+]/, 1)[0]
            let tag = "latest"
            if (prerelease) {
              tag = /^\d+$/.test(prerelease) ? "next" : prerelease
            }
            process.stdout.write(tag)
          ')
          PACKAGE_TAG="v$PACKAGE_VERSION"
          RELEASE_TAG="$PACKAGE_TAG"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_RELEASE_TAG" ]; then
              RELEASE_TAG="$INPUT_RELEASE_TAG"
            else
              RELEASE_TAG=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
            fi

            if [ -z "$RELEASE_TAG" ]; then
              echo "Unable to determine release tag for workflow_dispatch" >&2
              exit 1
            fi
          fi

          echo "package_tag=$PACKAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Validate pushed tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "$GITHUB_REF_NAME" != "${{ steps.release.outputs.package_tag }}" ]; then
            echo "Git tag $GITHUB_REF_NAME does not match package version tag ${{ steps.release.outputs.package_tag }}" >&2
            exit 1
          fi

      - name: Download Android build artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-build-artifacts

      - name: Build iOS frameworks
        run: yarn build:ios-frameworks

      - name: Verify iOS frameworks
        run: |
          set -euo pipefail

          # Frameworks missing MinimumOSVersion/CFBundleSupportedPlatforms/DT*
          # plist keys, or built against a beta SDK, hang forever in TestFlight
          # processing. Keep in sync with the runs-on macOS/Xcode version.
          EXPECTED_SDK_MAJOR=26

          SLICES=(
            "ios-arm64 iPhoneOS"
            "ios-arm64_x86_64-simulator iPhoneSimulator"
            "tvos-arm64 AppleTVOS"
            "tvos-arm64_x86_64-simulator AppleTVSimulator"
          )

          for entry in "${SLICES[@]}"; do
            slice="${entry% *}"
            expected_platform="${entry#* }"
            framework="ios/rnwhisper.xcframework/$slice/rnwhisper.framework"
            binary="$framework/rnwhisper"
            plist="$framework/Info.plist"

            if [ ! -f "$binary" ]; then
              echo "[$slice] Missing framework binary: $binary" >&2
              exit 1
            fi

            if ! min_os=$(plutil -extract MinimumOSVersion raw "$plist" 2>/dev/null); then
              echo "[$slice] Info.plist is missing MinimumOSVersion" >&2
              exit 1
            fi

            if ! platform=$(plutil -extract CFBundleSupportedPlatforms.0 raw "$plist" 2>/dev/null); then
              echo "[$slice] Info.plist is missing CFBundleSupportedPlatforms" >&2
              exit 1
            fi
            if [ "$platform" != "$expected_platform" ]; then
              echo "[$slice] CFBundleSupportedPlatforms is '$platform', expected '$expected_platform'" >&2
              exit 1
            fi

            if ! sdk_name=$(plutil -extract DTSDKName raw "$plist" 2>/dev/null); then
              echo "[$slice] Info.plist is missing DTSDKName" >&2
              exit 1
            fi

            build_sdk=$(otool -l "$binary" | grep -A5 LC_BUILD_VERSION | awk '/^ *sdk /{print $2; exit}')
            if [ -z "$build_sdk" ]; then
              echo "[$slice] Could not read sdk from LC_BUILD_VERSION" >&2
              exit 1
            fi
            if [ "${build_sdk%%.*}" != "$EXPECTED_SDK_MAJOR" ]; then
              echo "[$slice] Built against SDK $build_sdk (DTSDKName=$sdk_name), expected stable $EXPECTED_SDK_MAJOR.x" >&2
              exit 1
            fi

            echo "[$slice] OK: MinimumOSVersion=$min_os platform=$platform sdk=$build_sdk ($sdk_name)"
          done

      - name: Package iOS xcframework
        run: COPYFILE_DISABLE=1 tar -czf whisper-rn-ios-xcframework.tar.gz ios/rnwhisper.xcframework

      # Fills install/native-artifacts.json with the archive checksums so the
      # published package's postinstall can verify what it downloads.
      - name: Write native artifact manifest
        run: node ./install/write-native-artifacts-manifest.js

      # `yarn release` (release-it) creates the GitHub release locally; attach
      # the archives to it, or create the release if it does not exist yet.
      - name: Upload native release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              whisper-rn-android-jni-libs.tar.gz \
              whisper-rn-ios-xcframework.tar.gz \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              whisper-rn-android-jni-libs.tar.gz \
              whisper-rn-ios-xcframework.tar.gz \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes ""
          fi

      - name: Configure npm authentication
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_to_npm }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_1Y }}

      - name: Publish package
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_to_npm }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_1Y }}
        run: npm publish --tag "${{ steps.release.outputs.npm_tag }}"
