name: Setup
description: Setup Node.js and install dependencies

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20.x

    - name: Cache dependencies
      id: npm-cache
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: |
          node_modules
          example/node_modules
        # The manifests are named one by one: the key is evaluated again when the
        # job ends, and a `**` glob then walks node_modules and the build output
        # (15-30 s per job). No restore-keys: `npm ci` deletes node_modules, so
        # an older cache would be downloaded only to be thrown away.
        key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json', 'example/package-lock.json', 'package.json', 'example/package.json') }}

    - name: Install dependencies
      if: steps.npm-cache.outputs.cache-hit != 'true'
      run: |
        npm ci --prefix example
        npm ci
      shell: bash

    - name: Bootstrap & Build
      run: npm run bootstrap && npm run build
      shell: bash
