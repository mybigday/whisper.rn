buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:7.2.1"
  }
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"

def repoRootDir = project.projectDir.parentFile

// The whisper.cpp core (librnwhisper*.so) is prebuilt by default: the package's
// postinstall downloads android/src/main/jniLibs from the matching GitHub
// release, and only the JNI/JSI wrapper is compiled against the app's React
// Native. Set rnwhisperBuildFromSource=true (android/gradle.properties or
// -PrnwhisperBuildFromSource=true) to compile the core here as well.
def isRNWhisperBuildFromSource = (project.findProperty("rnwhisperBuildFromSource") ?: "false").toString() == "true"

// Hexagon (Qualcomm NPU). The prebuilt jniLibs already carry the
// rnwhisper_*_hexagon variant; when building from source it is only compiled
// if the SDK is on the build host (its host side needs the FastRPC headers;
// the device's libcdsprpc.so is dlopened at runtime). The DSP-side
// libggml-htp-*.so are produced by scripts/build-hexagon-htp.sh (Docker) into
// bin/arm64-v8a (shipped in the npm package) and copied into the host app's
// assets below, because the DSP loader reads them from the filesystem at
// runtime (see RNWhisper.java).
def htpLibSourceDir = new File(repoRootDir, "bin/arm64-v8a")
def hexagonSdkRoot = System.getenv("HEXAGON_SDK_ROOT") ?: "${System.getProperty('user.home')}/.hexagon-sdk/6.4.0.2"
def hexagonPresent = file(hexagonSdkRoot).exists()

def appProject = rootProject.allprojects.find { it.plugins.hasPlugin('com.android.application') }

if (appProject != null) {
  def configureHtpSyncTask = { Project applicationProject ->
    def assetsRootDir = new File(applicationProject.projectDir, "src/main/assets")
    def ggmlHexagonDir = new File(assetsRootDir, "ggml-hexagon")

    def syncTask = applicationProject.tasks.register("syncRNWhisperHtpAssets", Copy) {
      group = "whisper.rn"
      description = "Copies whisper.rn Hexagon HTP libraries into the host application's assets directory."

      onlyIf {
        if (!htpLibSourceDir.exists()) {
          logger.info("whisper.rn: No HTP libraries found at ${htpLibSourceDir.absolutePath}, skipping asset sync")
          return false
        }
        true
      }

      doFirst {
        if (!assetsRootDir.exists()) {
          assetsRootDir.mkdirs()
        }
        if (!ggmlHexagonDir.exists()) {
          ggmlHexagonDir.mkdirs()
          return
        }
        ggmlHexagonDir.listFiles({ File dir, String name ->
          name.startsWith("libggml-htp-") && name.endsWith(".so")
        } as FilenameFilter)?.each { File lib ->
          lib.delete()
        }
      }

      into(assetsRootDir)
      from(htpLibSourceDir) {
        include "libggml-htp-*.so"
        into "ggml-hexagon"
      }
    }

    def prepareHtpTask = applicationProject.tasks.findByName("prepareHTP")
    if (prepareHtpTask != null) {
      syncTask.configure {
        dependsOn(prepareHtpTask)
      }
    }

    applicationProject.tasks.matching { it.name == "preBuild" }.configureEach {
      dependsOn(syncTask)
    }
  }

  if (appProject.state.executed) {
    configureHtpSyncTask(appProject)
  } else {
    appProject.afterEvaluate {
      configureHtpSyncTask(appProject)
    }
  }
}

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["RNWhisper_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["RNWhisper_" + name]).toInteger()
}

def reactNativeArchitectures() {
  def value = project.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

// Detect RN Version as done here:
// https://github.com/software-mansion/react-native-reanimated/blob/66a6bd0e3a819ca7ae46751d36e405fe32b68b71/packages/react-native-reanimated/android/build.gradle#L73
def resolveReactNativeDirectory() {
  def reactNativeLocation = rootProject.ext.has("REACT_NATIVE_NODE_MODULES_DIR") ? rootProject.ext.get("REACT_NATIVE_NODE_MODULES_DIR") : null
  if (reactNativeLocation != null) {
    return file(reactNativeLocation)
  }

  // Fallback to node resolver for custom directory structures like monorepos.
  def reactNativePackage = file(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim())
  if(reactNativePackage.exists()) {
    return reactNativePackage.parentFile
  }

  throw new GradleException(
          "[Reanimated] Unable to resolve react-native location in node_modules. You should project extension property (in `app/build.gradle`) `REACT_NATIVE_NODE_MODULES_DIR` with path to react-native."
  )
}

def reactNativeRootDir = resolveReactNativeDirectory()

def reactProperties = new Properties()
file("$reactNativeRootDir/ReactAndroid/gradle.properties").withInputStream { reactProperties.load(it) }

def REACT_NATIVE_VERSION = reactProperties.getProperty("VERSION_NAME")
def REACT_NATIVE_MINOR_VERSION = REACT_NATIVE_VERSION.startsWith("0.0.0-") ? 1000 : REACT_NATIVE_VERSION.split("\\.")[1].toInteger()

android {
  def agpVersion = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION
  if (agpVersion.tokenize('.')[0].toInteger() >= 7) {
    namespace "com.rnwhisper"
  }
  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
    def cmakeArgs = [
      // Configure STL to be compatible with ReactAndroid JSI libraries
      "-DANDROID_STL=c++_shared",
      "-DREACT_NATIVE_MINOR_VERSION=${REACT_NATIVE_MINOR_VERSION}",
      "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
      "-DRNWHISPER_BUILD_FROM_SOURCE=${isRNWhisperBuildFromSource ? 'ON' : 'OFF'}"
    ]

    // Narrows the CPU-feature variants built for each ABI. Each variant is a
    // full copy of the source tree, so CI uses this to keep build times sane.
    def rnwhisperVariants = project.findProperty("rnwhisperVariants")?.toString()?.trim()
    if (rnwhisperVariants) {
      println("whisper.rn: building variants ${rnwhisperVariants}")
      cmakeArgs += ["-DRNWHISPER_ANDROID_VARIANTS=${rnwhisperVariants}"]
    }

    if (isRNWhisperBuildFromSource) {
      if (hexagonPresent) {
        println("whisper.rn: building from source, Hexagon SDK found at ${hexagonSdkRoot}, building the Hexagon variant")
        cmakeArgs += ["-DHEXAGON_SDK_ROOT=${hexagonSdkRoot}"]
      } else {
        println("whisper.rn: building from source, Hexagon SDK not found, building CPU-only")
      }
    } else {
      println("whisper.rn: using prebuilt native libraries (set rnwhisperBuildFromSource=true to build from source)")
    }
    externalNativeBuild {
      cmake {
        abiFilters (*reactNativeArchitectures())
        arguments(*cmakeArgs)
      }
    }
    ndk {
      // Ensure shared STL is used for JSI compatibility
      abiFilters (*reactNativeArchitectures())
    }
  }

  packagingOptions {
    doNotStrip resolveBuildType() == "debug" ? "**/**/*.so" : ""
    excludes = [
      "META-INF",
      "META-INF/**",
      "**/libc++_shared.so",
      "**/libfbjni.so",
      "**/libjsi.so",
      "**/libfolly_json.so",
      "**/libfolly_runtime.so",
      "**/libglog.so",
      "**/libreactnative.so",
      "**/libreactnativejni.so",
      "**/libturbomodulejsijni.so",
      "**/libreact_nativemodule_core.so",
    ]
  }

  buildFeatures {
    prefab = true
  }
  externalNativeBuild {
    cmake {
      path = file('src/main/CMakeLists.txt')
    }
  }
  if (isRNWhisperBuildFromSource) {
    // The core libraries come out of the CMake build; never package stale prebuilts.
    sourceSets {
      main {
        jniLibs.srcDirs = []
      }
    }
  }
  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
        java.srcDirs += ['src/newarch']
      } else {
        java.srcDirs += ['src/oldarch']
      }
    }
  }
}

repositories {
  mavenCentral()
  google()
}


dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"
}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src/")
    libraryName = "RNWhisper"
    codegenJavaPackageName = "com.rnwhisper"
  }
}

def resolveBuildType() {
    Gradle gradle = getGradle()
    String tskReqStr = gradle.getStartParameter().getTaskRequests()["args"].toString()

    return tskReqStr.contains("Release") ? "release" : "debug"
}
